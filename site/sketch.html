<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sketch · Matt Radiuk 95</title>
  <meta name="description" content="A generative p5.js sketch by Matt Radiuk.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a192f; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; }
    .chip {
      position: fixed; left: 12px; top: 12px; z-index: 2;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; background: #c0c0c0; color: #000;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff, 0 8px 20px rgba(0,0,0,.35);
      font: 14px "Pixelify Sans", Tahoma, sans-serif;
      transition: opacity .6s;
    }
    .chip b { font-weight: 600; }
    .chip a { color: #000080; }
    .chip.is-idle { opacity: 0; }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #64ffda; font: 26px VT323, monospace; }
    .thumb .chip { display: none; }
  </style>
</head>
<body>
  <div id="stage"><div class="loading">Loading...</div></div>
  <div class="chip"><b id="name">Sketch</b><span id="hint"></span><a href="./#projects">Matt Radiuk 95 →</a></div>
  <script type="module">
    import { mountSketch } from './js/os/p5host.js';
    import { getSketch } from './js/sketches/index.js';

    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'flow-field';
    const meta = getSketch(id);
    const thumb = params.has('thumb');
    if (thumb) {
      document.body.classList.add('thumb');
      // surface errors in screenshots
      const report = (msg) => {
        const el = document.createElement('pre');
        el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9;margin:0;color:#f55;font:12px monospace;white-space:pre-wrap';
        el.textContent = msg;
        document.body.append(el);
      };
      window.addEventListener('error', (e) => report(`${e.message} @ ${e.filename}:${e.lineno}`));
      window.addEventListener('unhandledrejection', (e) => report(String(e.reason?.stack || e.reason)));
    }

    if (!meta) {
      document.querySelector('.loading').textContent = `Unknown sketch: ${id}`;
    } else {
      document.title = `${meta.exe} · Matt Radiuk 95`;
      document.getElementById('name').textContent = meta.title;
      document.getElementById('hint').textContent = `· ${meta.hint}`;
      const stage = document.getElementById('stage');
      if (thumb) {
        // fixed size so headless browsers' viewport juggling can't resize (and clear) the canvas
        stage.style.cssText = `inset:auto;left:0;top:0;width:${Number(params.get('w')) || 480}px;height:${Number(params.get('h')) || 360}px`;
      }
      mountSketch(stage, id, { isActive: () => true, density: thumb ? 1 : 2 })
        .then(async (ctl) => {
          document.querySelector('.loading')?.remove();
          // ?warm=N pre-runs N frames (used to render the Explorer thumbnails).
          // Wait for the viewport to settle first: a resize clears the canvas.
          const warm = Number(params.get('warm')) || 0;
          if (warm) {
            ctl.p.noLoop();
            await new Promise((r) => setTimeout(r, 1500));
            ctl.p.redraw(warm);
          }
          if (params.has('debug')) {
            const pre = document.createElement('pre');
            pre.style.cssText = 'position:fixed;left:0;top:0;z-index:9;margin:0;color:#ff0;font:12px monospace;background:#000a';
            const c = ctl.canvas;
            pre.textContent = `frame=${ctl.p.frameCount} canvas=${c.width}x${c.height} css=${c.style.width}x${c.style.height} px=${ctl.p.get(c.width / 4, c.height / 2)} canvases=${document.querySelectorAll('canvas').length}`;
            document.body.append(pre);
          }
        })
        .catch((err) => { document.querySelector('.loading').textContent = err.message; });

      // hide the chip when the pointer is idle
      const chip = document.querySelector('.chip');
      let t = 0;
      const wake = () => { chip.classList.remove('is-idle'); clearTimeout(t); t = setTimeout(() => chip.classList.add('is-idle'), 2500); };
      window.addEventListener('pointermove', wake);
      wake();
    }
  </script>
</body>
</html>
