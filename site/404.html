<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Not Found · Matt Radiuk 95</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: #008080; font: 15px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
    .win { width: min(440px, 100%); padding: 3px; background: #c0c0c0;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff, 0 14px 34px -10px rgba(0,0,0,.45); }
    .title { display: flex; align-items: center; height: 26px; padding: 0 6px; color: #fff; font: 600 14px "Pixelify Sans", Tahoma, sans-serif;
      background: linear-gradient(90deg, #000080, #1084d0); }
    .body { display: flex; gap: 16px; padding: 18px 14px 6px; }
    .icon { flex: none; width: 32px; height: 32px; border-radius: 50%; background: #e0302a; color: #fff; display: grid; place-items: center; font: 700 20px sans-serif; box-shadow: 0 0 0 1px #000; }
    code { font-size: 13px; word-break: break-all; }
    .btns { display: flex; justify-content: center; gap: 8px; padding: 14px 0 12px; }
    a.btn { min-width: 84px; padding: 5px 14px; text-align: center; color: #000; text-decoration: none; background: #c0c0c0; font: 14px "Pixelify Sans", Tahoma, sans-serif;
      box-shadow: 0 0 0 1px #000, inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; }
    a.btn:active { box-shadow: 0 0 0 1px #000, inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }
  </style>
</head>
<body>
  <div class="win" role="alertdialog" aria-labelledby="t">
    <div class="title" id="t">C:\WINDOWS\EXPLORER.EXE</div>
    <div class="body">
      <div class="icon" aria-hidden="true">✕</div>
      <div>
        <p style="margin:0 0 8px">Cannot find the file <code id="path">that page</code> (or one of its components).</p>
        <p style="margin:0">Make sure the path and filename are correct, then try again. Or head back to the desktop.</p>
      </div>
    </div>
    <div class="btns"><a class="btn" href="/">OK</a></div>
  </div>
  <script>document.getElementById('path').textContent = "'" + location.pathname + "'";</script>
</body>
</html>
